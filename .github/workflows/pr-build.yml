name: PR build matrix

# This file replaces the previous 601-line workflow that called per-SDK
# build-*.sh scripts. The canonical entry point is the root
# CMake + presets:
#
#   cmake --preset <preset>
#   cmake --build  --preset <preset>
#   ctest          --preset <preset>     # debug presets only
#
# The wrapper scripts under scripts/build/build-core-*.sh package the artifacts for
# each frontend SDK; per-SDK jobs that need those artifacts call the wrapper
# instead of duplicating cmake calls.

on:
  workflow_dispatch: {}

# fork-only measurement harness (agarg21): only the swift-spm job, dispatch-only.
permissions:
  contents: read

jobs:
  swift-spm:
    # Builds the Apple MLX Swift runtime, including mlx-audio-swift. This
    # needs Swift 6.2+, so use the macOS 26/Xcode 26 runner line.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          platform: ios
      # Sources/RunAnywhere/Generated is IDL codegen output and is not tracked,
      # so `swift build` below has nothing to compile without this. (It also
      # installs the pinned protoc the native build wants, replacing the plain
      # `brew install protobuf` that used to sit here.)
      - uses: ./.github/actions/generate-idl
        with:
          languages: swift
      - name: Download vendored ONNX Runtime (iOS xcframework)
        run: bash core/scripts/ios/download-onnx.sh
      - name: Download vendored Sherpa-ONNX (iOS xcframework)
        run: bash core/scripts/ios/download-sherpa-onnx.sh
      - name: Build pinned Sherpa/ONNX static inventory (macOS arm64)
        run: bash core/scripts/macos/download-sherpa-onnx.sh
      - name: Build XCFramework
        env:
          # The NeuRT (Apple ANE) engine is implemented in the sibling `neurun` repo, which is
          # PRIVATE and not cloned here. Without it the engine builds as a non-routable shell that
          # refuses registration, which is exactly what this job needs: it verifies that the Swift
          # package COMPILES and LINKS, not that ANE inference works. The script otherwise refuses
          # to package a stub, so opt in explicitly — this artifact is never shipped.
          RAC_ALLOW_NEURT_STUB: "1"
        run: ./bindings/swift/scripts/build-core-xcframework.sh
      - name: Build all Swift products and run tests
        env:
          RUNANYWHERE_USE_LOCAL_NATIVES: "1"
        run: |
          set -euo pipefail
          swift build --build-tests --jobs 2
          swift test --skip-build --jobs 2
      - name: SwiftLint (SDK, strict)
        working-directory: bindings/swift
        run: |
          set -euo pipefail
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict --quiet
      # Periphery remains advisory until the runner image ships it and the
      # repository has a checked-in, reproducible scan configuration.
      - name: Periphery unused-code scan (advisory)
        continue-on-error: true
        working-directory: bindings/swift
        run: |
          set -euo pipefail
          if command -v periphery >/dev/null 2>&1; then
            periphery scan --quiet
          else
            echo "::notice::periphery is not installed on this runner; advisory scan skipped"
          fi
